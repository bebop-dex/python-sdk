[project]
name = "python-sdk"
version = "0.1.4"
description = "Python SDK for Bebop"
authors = [
    {name = "Rad", email = "radu.popescu@bebop.xyz"}
]
requires-python = ">=3.11,<3.12"
readme = "README.md"
dependencies = [
    "web3==7.16.0",
    "orjson==3.11.9",
    "eth-account==0.13.7",
    "eth-utils==6.0.0",
    "eth-typing==6.0.0",
    "python-dotenv==1.0.1",
    "pydantic==2.13.4",
    "hexbytes==1.3.1",
    "typing-extensions==4.14.1",
    "aiohttp==3.13.5",
]

[dependency-groups]
dev = [
    "types-orjson==3.6.2",
    "ipykernel==6.29.5",
    "deptry==0.20.0",
    "mypy==1.11.2",
    "pre-commit==3.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["python_sdk"]

[tool.mypy]
files = ["python_sdk"]
disallow_untyped_defs = "True"
disallow_any_unimported = "True"
no_implicit_optional = "True"
check_untyped_defs = "True"
warn_return_any = "True"
warn_unused_ignores = "True"
show_error_codes = "True"

[tool.ruff]
target-version = "py311"
line-length = 120
fix = true
lint.select = [
    # flake8-2020
    "YTT",
    # flake8-bandit
    "S",
    # flake8-bugbear
    "B",
    # flake8-builtins
    "A",
    # flake8-comprehensions
    "C4",
    # flake8-debugger
    "T10",
    # flake8-simplify
    "SIM",
    # isort
    "I",
    # mccabe
    "C90",
    # pycodestyle
    "E", "W",
    # pyflakes
    "F",
    # pygrep-hooks
    "PGH",
    # pyupgrade
    "UP",
    # ruff
    "RUF",
    # tryceratops
    "TRY",
]
lint.ignore = [
    # LineTooLong
    "E501",
    # DoNotAssignLambda
    "E731",
    # Assert
    "S101",
    # RaiseVanillaArgs
    "TRY003",
    # CreateYourOwnException
    "TRY002",
    "TRY301",
    "RUF012"
]

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
